<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Codezilla Clever Fox Icon -->
  <defs>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="60%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="#0C0F17"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#26304B" stroke-width="2"/>
  
  <!-- Left Ear -->
  <polygon points="22,18 42,42 20,48" fill="url(#foxGrad)"/>
  <polygon points="26,24 38,40 24,44" fill="#171D2D"/>
  
  <!-- Right Ear -->
  <polygon points="78,18 80,48 58,42" fill="url(#foxGrad)"/>
  <polygon points="74,24 76,44 62,40" fill="#171D2D"/>
  
  <!-- Head Face Shape -->
  <polygon points="50,78 18,44 32,32 50,42 68,32 82,44" fill="url(#foxGrad)"/>
  
  <!-- Forehead Accent / Diamond -->
  <polygon points="50,42 43,51 50,60 57,51" fill="#FEF08A" opacity="0.9"/>
  
  <!-- Left Cheek White/Silver -->
  <polygon points="18,44 50,78 35,58" fill="#F1F5F9"/>
  <!-- Right Cheek White/Silver -->
  <polygon points="82,44 65,58 50,78" fill="#E2E8F0"/>
  
  <!-- Sharp Clever Eyes -->
  <!-- Left Eye: competitive angled slit with cyan/purple visor glow -->
  <polygon points="34,48 45,51 37,53" fill="url(#purpleGlow)"/>
  <polygon points="36,49 42,51 38,52" fill="#FFFFFF"/>
  
  <!-- Right Eye -->
  <polygon points="66,48 63,53 55,51" fill="url(#purpleGlow)"/>
  <polygon points="64,49 62,52 58,51" fill="#FFFFFF"/>

  <!-- Sleek Dark Nose Tip -->
  <polygon points="50,78 46,73 54,73" fill="#07090E"/>
</svg>